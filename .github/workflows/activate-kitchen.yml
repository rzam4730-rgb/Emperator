name: Activate Kitchen Core
on:
  push:
    branches: [main]
jobs:
  activate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrate kitchen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/main.py'); s=p.read_text(encoding='utf-8')
          imp='from .kitchen import install_kitchen_schema, mount_kitchen_routes\n'
          if imp not in s:
              marker='from .subscription import'
              pos=s.find(marker); end=s.find('\n',pos)
              s=s[:end+1]+imp+s[end+1:]
          if 'install_kitchen_schema(c)' not in s:
              marker='    c.executescript(SUBSCRIPTION_SCHEMA)'
              s=s.replace(marker,marker+'\n    install_kitchen_schema(c)',1)
          if 'mount_kitchen_routes(app, conn, current_user)' not in s:
              s += '\nmount_kitchen_routes(app, conn, current_user)\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile backend/app/main.py backend/app/kitchen.py
      - name: Commit integration
        run: |
          git config user.name 'Emperator Bot'
          git config user.email 'bot@emperator.local'
          git add backend/app/main.py
          git diff --cached --quiet || git commit -m 'feat: activate kitchen core'
          git push
