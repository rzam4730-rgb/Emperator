name: Integrate Payment Core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-payment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate payment routes
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/main.py")
          text = path.read_text(encoding="utf-8")

          import_line = "from .payment_routes import PAYMENT_SCHEMA, mount_payment_routes\n"
          schema_marker = "    c.executescript(PAYMENT_SCHEMA)"
          mount_marker = "mount_payment_routes(app, conn, current_user, subscription_view, ensure_subscription, plan_limits)"

          changed = False

          if import_line not in text:
              anchor = "from .subscription import SCHEMA as SUBSCRIPTION_SCHEMA, seed_plans, ensure_subscription, plan_limits, get_usage, increment_usage, utcnow\n"
              if anchor not in text:
                  raise SystemExit("subscription import anchor not found")
              text = text.replace(anchor, anchor + import_line, 1)
              changed = True

          if schema_marker not in text:
              anchor = "    c.executescript(SUBSCRIPTION_SCHEMA)\n"
              if anchor not in text:
                  raise SystemExit("subscription schema anchor not found")
              text = text.replace(anchor, anchor + "    c.executescript(PAYMENT_SCHEMA)\n", 1)
              changed = True

          if mount_marker not in text:
              anchor = "app.add_middleware(CORSMiddleware, allow_origins=[\"*\"], allow_credentials=False, allow_methods=[\"GET\",\"POST\",\"PUT\",\"PATCH\",\"DELETE\",\"OPTIONS\"], allow_headers=[\"Authorization\",\"Content-Type\"])\n"
              if anchor not in text:
                  raise SystemExit("CORS anchor not found")
              text = text.replace(anchor, anchor + "\n" + mount_marker + "\n", 1)
              changed = True

          if changed:
              path.write_text(text, encoding="utf-8")
          print("payment integration", "updated" if changed else "already integrated")

      - name: Validate Python syntax
        shell: bash
        run: |
          python -m py_compile backend/app/main.py backend/app/payment.py backend/app/payment_routes.py backend/app/payment_integration.py

      - name: Commit integration
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- backend/app/main.py; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          git commit -m "feat: mount payment core in FastAPI"
          git push
