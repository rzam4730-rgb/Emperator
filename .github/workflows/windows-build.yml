name: Emperator Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11 for Windows x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r backend\requirements.txt
          pip install "pyinstaller==6.11.1" "pywin32==308"

      - name: Validate backend syntax
        shell: pwsh
        run: |
          python -m compileall -q backend
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed' }

      - name: Run backend integration smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$(Resolve-Path backend)"
          python -c "from app.integration_smoke import run; print(run())"
          if ($LASTEXITCODE -ne 0) { throw 'Backend integration smoke test failed' }

      - name: Build backend executable
        shell: pwsh
        run: |
          if (Test-Path dist-backend) { Remove-Item dist-backend -Recurse -Force }
          pyinstaller --noconfirm --clean --onefile --name emperator-backend --paths backend backend\launcher.py
          New-Item -ItemType Directory -Force dist-backend | Out-Null
          Copy-Item dist\emperator-backend.exe dist-backend\emperator-backend.exe

      - name: Build printer bridge executable
        shell: pwsh
        run: |
          if (Test-Path dist-printer) { Remove-Item dist-printer -Recurse -Force }
          pyinstaller --noconfirm --clean --onefile --name emperator-printer-bridge desktop\printer_bridge.py
          New-Item -ItemType Directory -Force dist-printer | Out-Null
          Copy-Item dist\emperator-printer-bridge.exe dist-printer\emperator-printer-bridge.exe

      - name: Prepare frontend for Electron packaging
        shell: pwsh
        run: |
          if (Test-Path desktop\frontend) { Remove-Item desktop\frontend -Recurse -Force }
          Copy-Item frontend desktop\frontend -Recurse

      - name: Verify printer UI module
        shell: pwsh
        run: |
          if (-not (Test-Path desktop\frontend\printer.js)) { throw 'printer.js missing from frontend build' }

      - name: Install desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        shell: pwsh
        run: npm run dist

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop\dist\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Emperator Setup.exe was not produced' }
          Write-Host "Installer: $($installer.FullName)"

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Emperator-Windows-Installer-x64
          path: desktop/dist/*.exe
