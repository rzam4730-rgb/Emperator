name: Emperator Web Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@988b5f8b5f6f2f1f7d5e1d8c3d8a8f6d0b7c2b1a # pinned
      - name: Build Web API image
        run: docker build -f deploy/web/Dockerfile.backend -t emperator-api:test .
      - name: Build Web frontend image
        run: docker build -f deploy/web/Dockerfile.frontend -t emperator-web:test .
      - name: Validate compose configuration
        env:
          EMPERATOR_JWT_SECRET: ci-test-secret-change-me
        run: docker compose -f deploy/web/docker-compose.yml config
