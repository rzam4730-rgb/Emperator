name: Emperator Build Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Web and Docker build validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Web API image
        run: docker build -f deploy/web/Dockerfile.backend -t emperator-api:ci .

      - name: Build Web frontend image
        run: docker build -f deploy/web/Dockerfile.frontend -t emperator-web:ci .

      - name: Validate Compose configuration
        env:
          EMPERATOR_JWT_SECRET: ci-test-secret-change-me
        run: docker compose -f deploy/web/docker-compose.yml config

  windows-build:
    name: Windows desktop packaging validation
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install backend and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller==5.13.2 pywin32==306

      - name: Prepare temporary packaging workspace
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "emperator-build"
          New-Item -ItemType Directory -Force -Path "$buildRoot\dist-backend", "$buildRoot\dist-printer", "$buildRoot\desktop", "$buildRoot\spec", "$buildRoot\work-backend", "$buildRoot\work-printer" | Out-Null
          "EMPERATOR_BUILD_ROOT=$buildRoot" >> $env:GITHUB_ENV

      - name: Build backend executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name emperator-backend --paths backend --distpath "$env:EMPERATOR_BUILD_ROOT\dist-backend" --workpath "$env:EMPERATOR_BUILD_ROOT\work-backend" --specpath "$env:EMPERATOR_BUILD_ROOT\spec" backend\launcher.py

      - name: Build printer bridge executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name emperator-printer-bridge --distpath "$env:EMPERATOR_BUILD_ROOT\dist-printer" --workpath "$env:EMPERATOR_BUILD_ROOT\work-printer" --specpath "$env:EMPERATOR_BUILD_ROOT\spec" desktop\printer_bridge.py

      - name: Stage desktop packaging inputs
        shell: pwsh
        run: |
          Copy-Item -Path desktop\* -Destination "$env:EMPERATOR_BUILD_ROOT\desktop" -Recurse
          Copy-Item -Path frontend -Destination "$env:EMPERATOR_BUILD_ROOT\desktop\frontend" -Recurse
          if (-not (Test-Path "$env:EMPERATOR_BUILD_ROOT\desktop\frontend\printer.js")) {
            throw "frontend/printer.js missing from the desktop packaging inputs"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          Push-Location "$env:EMPERATOR_BUILD_ROOT\desktop"
          try {
            npm install --no-package-lock
            if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
            npm run dist
            if ($LASTEXITCODE -ne 0) { throw "npm run dist failed" }
          } finally {
            Pop-Location
          }

      - name: Upload Windows installer for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Emperator-Windows-Installer
          path: ${{ runner.temp }}/emperator-build/desktop/dist/*.exe
          if-no-files-found: error
