name: Build Emperator Windows 7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Python 3.8.10
        shell: powershell
        run: |
          Invoke-WebRequest "https://www.python.org/ftp/python/3.8.10/python-3.8.10-amd64.exe" -OutFile python.exe
          Start-Process .\python.exe -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0" -Wait

      - name: Install dependencies
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\Python38;C:\Program Files\Python38\Scripts;" + $env:Path
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller==5.13.2

      - name: Build EXE
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\Python38;C:\Program Files\Python38\Scripts;" + $env:Path
          python -m PyInstaller --noconfirm --clean --onedir --name Emperator --add-data "backend;backend" --add-data "frontend;frontend" desktop/emperor_desktop.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Build Setup
        shell: powershell
        run: iscc installer/Emperor.iss

      - name: Upload Setup V2
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: EmperatorSetup-V2-DarkUI
          path: installer/Output/EmperatorSetup-V2-DarkUI.exe