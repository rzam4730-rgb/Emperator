name: Activate Order Inventory Integration
on:
  push:
    branches: [main]
jobs:
  activate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/main.py'); s=p.read_text(encoding='utf-8')
          imp='from .order_inventory import mount_order_inventory_routes\n'
          if imp not in s:
              marker='from .subscription import'; pos=s.find(marker); end=s.find('\n',pos); s=s[:end+1]+imp+s[end+1:]
          if 'mount_order_inventory_routes(app, conn, current_user)' not in s: s += '\nmount_order_inventory_routes(app, conn, current_user)\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile backend/app/main.py backend/app/order_inventory.py
      - name: Commit
        run: |
          git config user.name 'Emperator Bot'
          git config user.email 'bot@emperator.local'
          git add backend/app/main.py
          git diff --cached --quiet || git commit -m 'feat: activate order inventory integration'
          git push
