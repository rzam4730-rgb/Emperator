name: Emperator CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python modules
        run: find backend/app -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Backend import smoke
        env:
          PYTHONPATH: .
        run: python -c "from backend.app.main import app; print('Emperator API import OK')"

      - name: Integration smoke
        env:
          PYTHONPATH: .
        run: python -m backend.app.integration_smoke

      - name: Check frontend runtime and packaging assets
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          frontend = Path("frontend")
          static_source = Path("backend/app/static_frontend.py").read_text(encoding="utf-8")
          assets = sorted(set(re.findall(r"/assets/([^?\s\"']+)", static_source)))
          missing = [str(frontend / asset) for asset in assets if not (frontend / asset).is_file()]

          if not (frontend / "index.html").is_file():
              missing.append(str(frontend / "index.html"))
          if not (frontend / "printer.js").is_file():
              missing.append(str(frontend / "printer.js"))

          manifest = json.loads(Path("desktop/package.json").read_text(encoding="utf-8"))
          frontend_packaged = any(
              resource.get("from") == "frontend" and resource.get("to") == "frontend"
              for resource in manifest.get("build", {}).get("extraResources", [])
          )
          if not frontend_packaged:
              missing.append("desktop/package.json frontend extraResources entry")

          if missing:
              raise SystemExit("Missing frontend runtime/build assets:\n- " + "\n- ".join(missing))

          print(f"Frontend runtime assets OK ({len(assets)} dynamically injected assets); desktop printer asset is packaged.")
          PY
